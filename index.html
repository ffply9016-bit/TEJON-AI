<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEJON AI | Created by Raghu Gohel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080510;color:white;font-family:Arial,sans-serif;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:#0c0715;border-right:1px solid #7625bb;padding:20px 12px;display:flex;flex-direction:column}
.logo{text-align:center;font-size:27px;font-weight:bold;color:#d65aff;text-shadow:0 0 15px #a020ff;margin:10px 0 30px}
.menu button{display:block;width:100%;padding:14px 10px;margin:5px 0;background:transparent;color:white;border:1px solid transparent;border-radius:10px;text-align:left;cursor:pointer}
.menu button:hover,.menu button.active{background:#28103b;border-color:#a33cff}
.creator{margin-top:auto;text-align:center;font-size:11px;color:#c98aff;padding:15px 0}
main{flex:1;min-width:0;padding:22px}
.top{text-align:right}
.top button{padding:10px 14px;background:#1c1028;color:white;border:1px solid #8038ac;border-radius:20px}
.hero{text-align:center;padding:35px 0}
.hero h1{font-size:clamp(42px,8vw,78px);text-shadow:0 0 20px #9d24ff}
.hero h1 span{color:#d455ff}
.hero p{color:#c8a9e4;letter-spacing:3px;font-size:12px;margin-top:12px}
.badge{display:inline-block;margin-top:22px;padding:9px 15px;border:1px solid #8e37bf;border-radius:25px;color:#e1baff;font-size:11px}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:20px 0}
.card{padding:18px 8px;background:#120b1d;border:1px solid #522474;border-radius:13px;color:white;text-align:center;cursor:pointer}
.card:hover{border-color:#d353ff;box-shadow:0 0 15px #a020ff44}
.card b{display:block;color:#d78bff;margin-bottom:8px}
.card small{color:#b8a9c8}
.chat{background:#0e0916;border:1px solid #682b91;border-radius:16px;padding:17px;min-height:300px;display:flex;flex-direction:column}
#messages{line-height:1.7;overflow-wrap:anywhere}
.msg{background:#1a1126;padding:12px;border-radius:10px;margin:10px 0;white-space:pre-wrap}
.msg b{color:#dc85ff}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.suggestions button{background:#1a1025;color:#eee;border:1px solid #503366;padding:9px 12px;border-radius:20px;cursor:pointer}
.input{display:flex;gap:8px;margin-top:auto;padding-top:20px}
input{min-width:0;flex:1;background:#17101f;color:white;border:1px solid #7632a7;border-radius:10px;padding:14px;outline:none}
.send{background:linear-gradient(135deg,#d34cff,#7020e8);color:white;border:0;border-radius:10px;padding:0 18px;cursor:pointer}
footer{text-align:center;color:#d16aff;font-size:11px;letter-spacing:3px;padding:25px 5px}
body.light{background:#f7f0ff;color:#21142d}
body.light .sidebar,body.light .chat,body.light .card{background:#fff;color:#21142d}
body.light .msg{background:#f0e4ff}
@media(max-width:600px){.sidebar{width:75px;padding:12px 5px}.logo{font-size:12px;overflow-wrap:anywhere}.menu button{text-align:center;font-size:10px;padding:12px 2px;overflow-wrap:anywhere}.creator{font-size:8px;overflow-wrap:anywhere}main{padding:12px}.hero{padding:25px 0}.hero p{letter-spacing:1px}.chat{padding:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">✦ TEJON AI</div>
<nav class="menu">
<button class="active" onclick="home()">⌂ Home</button>
<button onclick="focusInput()">💬 AI Chat</button>
<button onclick="feature('Image Generator')">🎨 Image Generator</button>
<button onclick="feature('Code Helper')">💻 Code Helper</button>
<button onclick="feature('Study Helper')">📚 Study Helper</button>
<button onclick="feature('Web Search')">🌐 Web Search</button>
<button onclick="historyView()">🕘 Chat History</button>
</nav>
<div class="creator">CREATED BY<br>RAGHU GOHEL</div>
</aside>

<main>
<div class="top"><button onclick="document.body.classList.toggle('light')">☾ Theme</button></div>
<section class="hero">
<h1>TEJON <span>AI</span></h1>
<p>YOUR INTELLIGENCE. YOUR FUTURE.</p>
<div class="badge">✦ YOUR PERSONAL AI ASSISTANT ✦</div>
</section>

<section class="features">
<button class="card" onclick="focusInput()"><b>💬 AI Chat</b><small>Ask anything</small></button>
<button class="card" onclick="feature('Image Generator')"><b>🎨 Image Generator</b><small>Create images</small></button>
<button class="card" onclick="feature('Code Helper')"><b>💻 Code Helper</b><small>Write code</small></button>
<button class="card" onclick="feature('Study Helper')"><b>📚 Study Helper</b><small>Learn smarter</small></button>
<button class="card" onclick="feature('Web Search')"><b>🌐 Web Search</b><small>Find information</small></button>
</section>

<section class="chat" id="chat">
<div id="messages"><div class="msg"><b>TEJON AI</b><br>Welcome! 👋<br>I'm your personal AI assistant. Choose a tool or type a message to get started.</div></div>
<div class="suggestions">
<button onclick="ask('Explain artificial intelligence')">💡 Explain AI</button>
<button onclick="feature('Image Generator')">🎨 Create Image</button>
<button onclick="feature('Code Helper')">💻 Write Code</button>
<button onclick="feature('Study Helper')">📚 Study Help</button>
</div>
<div class="input">
<input id="prompt" placeholder="Message TEJON AI..." onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">➤</button>
</div>
</section>
<footer>✦ CREATED BY RAGHU GOHEL ✦</footer>
</main>
</div>

<script>
const messages=document.getElementById('messages');
const promptBox=document.getElementById('prompt');
let history=JSON.parse(localStorage.getItem('tejonHistory')||'[]');

function addMessage(who,text){
const div=document.createElement('div');
div.className='msg';
const b=document.createElement('b');
b.textContent=who;
div.appendChild(b);
div.appendChild(document.createElement('br'));
div.appendChild(document.createTextNode(text));
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}
function focusInput(){promptBox.focus()}
function ask(text){promptBox.value=text;send()}
function send(){
const text=promptBox.value.trim();
if(!text)return;
addMessage('YOU',text);
history.push({q:text,time:new Date().toLocaleString()});
localStorage.setItem('tejonHistory',JSON.stringify(history));
addMessage('TEJON AI','The website design is ready! Connect an AI service to enable real AI-generated answers.');
promptBox.value='';
}
function feature(name){
messages.innerHTML='';
addMessage('TEJON AI',name+' selected! This tool needs an AI service or API integration to work.');
document.getElementById('chat').scrollIntoView({behavior:'smooth'});
}
function historyView(){
messages.innerHTML='';
addMessage('CHAT HISTORY',history.length?history.map((h,i)=>(i+1)+'. '+h.q+' ('+h.time+')').join('\n'):'No chat history yet.');
}
function home(){
messages.innerHTML='';
addMessage('TEJON AI',"Welcome back! I'm your personal AI assistant.");
}
</script>
</body>
</html>
